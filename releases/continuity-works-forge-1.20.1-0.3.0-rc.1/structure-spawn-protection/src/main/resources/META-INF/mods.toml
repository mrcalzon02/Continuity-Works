modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/mrcalzon02/Continuity-Works/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Continuity Works Structure Spawn Protection"
displayURL="https://github.com/mrcalzon02/Continuity-Works"
authors="Continuity Works"
description='''
Standalone, registry-aware structure spawning protection for Forge 1.20.1. Enforces a hard 500-block minimum horizontal exclusion zone around enrolled structures, applies per-piece jigsaw reservations while assemblies grow, prevents jigsaw self-collisions, indexes existing starts, and supports tag/profile-driven automatic inclusion without replacing other mods' structure definitions.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="BOTH"
