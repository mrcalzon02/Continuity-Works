name: Verify and Deploy Public Continuity Works Service

on:
  workflow_run:
    workflows: ["Validate Continuity Works"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: continuity-works-public-service
  cancel-in-progress: true

env:
  CONTINUITY_WORKS_API: https://continuity-works-mrcalzon02-api.onrender.com
  CONTINUITY_WORKS_FRONTEND: https://mrcalzon02.github.io/Continuity-Works/
  CONTINUITY_WORKS_ORIGIN: https://mrcalzon02.github.io
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  remote-api:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight configured API health route
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --location \
              --output /tmp/continuity-works-health.txt \
              --write-out '%{http_code}' \
              --max-time 30 \
              "$CONTINUITY_WORKS_API/v1/health" || true)"
            if [ "$status" = "404" ]; then
              echo "Configured API candidate is reachable but does not expose /v1/health (HTTP 404)." >&2
              echo "Activate/correct the Continuity Works runtime at $CONTINUITY_WORKS_API before PUBLIC_SERVICEABILITY can pass." >&2
              cat /tmp/continuity-works-health.txt >&2 || true
              exit 1
            fi
            if [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Configured API candidate could not be reached during health-route preflight; continuing to the bounded deployment wait." >&2
      - name: Wait for configured host to serve this exact main commit, then verify remote API
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 90); do
            if python scripts/public_serviceability.py \
              --api "$CONTINUITY_WORKS_API" \
              --expected-commit "$TARGET_SHA" \
              --origin "$CONTINUITY_WORKS_ORIGIN"; then
              exit 0
            fi
            sleep 10
          done
          echo "Remote Continuity Works API never passed PUBLIC_SERVICEABILITY for commit $TARGET_SHA" >&2
          exit 1

  build-pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build intended Continuity Works Pages artifact
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Stamp configured API discovery and validate static artifact
        run: |
          python scripts/build_pages_discovery.py \
            --output dist/api.json \
            --commit "$TARGET_SHA" \
            --deployment configured-api-candidate
          test -f dist/index.html
          test -f dist/api.json
          test -f dist/llms.txt
          test -f dist/ai.json
          test -f dist/.well-known/continuity-works.json
          test -d dist/assets
          test -f frontend/src/components/ManualCapabilityWorkbench.js
          grep -q 'continuity-works-api' dist/index.html
          grep -R -q 'Manual Capability Workbench' dist/assets
          python scripts/public_serviceability.py --static-dir dist --expected-api "$CONTINUITY_WORKS_API"
          python scripts/agent_discoverability.py --static-dir dist --expected-api "$CONTINUITY_WORKS_API"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload intended Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

  pages-to-api:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight Pages-advertised API health route
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --location \
              --output /tmp/continuity-works-health.txt \
              --write-out '%{http_code}' \
              --max-time 30 \
              "$CONTINUITY_WORKS_API/v1/health" || true)"
            if [ "$status" = "404" ]; then
              echo "Pages advertises an API candidate that is reachable but missing /v1/health (HTTP 404)." >&2
              echo "The Pages artifact remains deployed, but Pages-to-API PUBLIC_SERVICEABILITY cannot be verified." >&2
              cat /tmp/continuity-works-health.txt >&2 || true
              exit 1
            fi
            if [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages-advertised API could not be reached during preflight; continuing to the bounded discovery wait." >&2
      - name: Verify discovery exactly as a zero-JavaScript external agent encounters it
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 60); do
            if python scripts/public_serviceability.py \
              --pages "$CONTINUITY_WORKS_FRONTEND" \
              --expected-commit "$TARGET_SHA" \
              --origin "$CONTINUITY_WORKS_ORIGIN" \
              && python scripts/agent_discoverability.py \
              --pages "$CONTINUITY_WORKS_FRONTEND" \
              --expected-api "$CONTINUITY_WORKS_API"; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages-to-API discovery never reached VERIFIED for Continuity Works commit $TARGET_SHA" >&2
          exit 1

  report:
    if: always()
    needs: [remote-api, build-pages, deploy-pages, pages-to-api]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Publish external serviceability status
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_API_RESULT: ${{ needs.remote-api.result }}
          BUILD_PAGES_RESULT: ${{ needs.build-pages.result }}
          DEPLOY_PAGES_RESULT: ${{ needs.deploy-pages.result }}
          PAGES_TO_API_RESULT: ${{ needs.pages-to-api.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          results = {
              'remote-api': os.environ.get('REMOTE_API_RESULT'),
              'build-pages': os.environ.get('BUILD_PAGES_RESULT'),
              'deploy-pages': os.environ.get('DEPLOY_PAGES_RESULT'),
              'pages-to-api': os.environ.get('PAGES_TO_API_RESULT'),
          }
          verified = all(value == 'success' for value in results.values())
          print(json.dumps({
              'state': 'success' if verified else 'failure',
              'context': 'continuity-works/public-serviceability',
              'description': 'External-service VERIFIED' if verified else 'External-service NOT VERIFIED',
              'target_url': os.environ['TARGET_URL'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"

      - name: Fail closed when any required public-service stage did not succeed
        if: >-
          needs.remote-api.result != 'success' ||
          needs.build-pages.result != 'success' ||
          needs.deploy-pages.result != 'success' ||
          needs.pages-to-api.result != 'success'
        run: |
          echo "Continuity Works public service was not fully verified; failing workflow."
          exit 1
