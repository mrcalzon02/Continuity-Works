name: Build and Release Continuity Works Forge JAR

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-jar.yml'
      - 'modules/continuityworks_runtime/forge-1.20.1/**'
      - 'examples/biome_expander/runtime_mod/1.20.1/**'
      - 'modules/structure_spawn_protection/forge-1.20.1/**'
      - 'releases/continuity-works-forge-1.20.1-0.3.0-rc.2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuityworks-forge-jar-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build and verify single Forge JAR
        run: |
          python releases/continuity-works-forge-1.20.1-0.3.0-rc.2/build_release_jar.py

      - name: Record artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR='releases/continuity-works-forge-1.20.1-0.3.0-rc.2/dist/ContinuityWorks-Forge-1.20.1-0.3.0-rc.2.jar'
          test -s "$JAR"
          SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$JAR")"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          printf 'JAR: %s\nBytes: %s\nSHA-256: %s\n' "$JAR" "$SIZE" "$SHA256"

      - name: Publish GitHub prerelease with JAR asset
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.artifact.outputs.jar }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.3.0-rc.2'
          TITLE='Continuity Works Forge 1.20.1 — 0.3.0-rc.2'
          cat > /tmp/continuityworks-release-notes.md <<EOF
          Continuity Works Forge 1.20.1 release candidate built directly from authoritative main commit ${GITHUB_SHA}.

          Installable artifact: ContinuityWorks-Forge-1.20.1-0.3.0-rc.2.jar

          This single Forge JAR contains the Continuity Works biome runtime and Structure Spawn Protection runtime. The biome build materializes the authoritative 128-biome anthology and carries the currently materialized worldgen/NBT resources. Structure Spawn Protection retains the hard minimum 500-block footprint-based exclusion contract and jigsaw handling.

          Artifact bytes: ${SIZE}
          SHA-256: ${SHA256}

          The E01 era structure line is developed through E01-015, but non-materialized structure specifications are not misrepresented as playable NBT in this binary.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/continuityworks-release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/continuityworks-release-notes.md \
              --prerelease
          fi

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.3.0-rc.2 --json tagName,targetCommitish,isPrerelease,url,assets
