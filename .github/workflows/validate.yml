name: Validate Structure Capability

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke API
        run: python -m structure_capability.cli capabilities
