name: Validate Structure Capability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and HTTP contract tests
        run: python -m unittest discover -s tests -v
      - name: Local public-boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          HOST=0.0.0.0 PORT=8787 python scripts/run_api.py >/tmp/structuresmith-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(40):
              try:
                  with urlopen('http://127.0.0.1:8787/v1/health', timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('StructureSmith HTTP server did not become healthy')
          PY
          python scripts/http_smoke.py http://127.0.0.1:8787
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/status.json
          import json
          import os

          state = os.environ['STATUS_STATE']
          print(json.dumps({
              'state': 'success' if state == 'success' else 'failure',
              'context': 'structuresmith/validate',
              'description': 'Full regression and local HTTP smoke',
              'target_url': os.environ['TARGET_URL'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
