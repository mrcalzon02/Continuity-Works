services:
  - type: web
    name: continuity-works-mrcalzon02-api
    runtime: python
    plan: starter
    branch: main
    buildCommand: python -m pip install .
    startCommand: python scripts/run_api.py
    healthCheckPath: /v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CONTINUITY_WORKS_CORS_ORIGIN
        value: https://mrcalzon02.github.io
      - key: CONTINUITY_WORKS_PUBLIC_BASE_URL
        value: https://continuity-works-mrcalzon02-api.onrender.com
      - key: CONTINUITY_WORKS_FRONTEND_URL
        value: https://mrcalzon02.github.io/Continuity-Works/
      - key: CONTINUITY_WORKS_DEPLOYMENT
        value: production
